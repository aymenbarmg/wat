
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لمسه</title>

<link rel="apple-touch-icon" href="icon.jpg">
<link rel="icon" href="icon.jpg">
<link rel="icon" type="image/jpeg" href="icon.jpg">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo','Tahoma',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        rgba(0,0,0,0.48),
        rgba(0,0,0,0.48)
    ),
    url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1400&auto=format&fit=crop");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   الشاشات
========================= */

.screen{
    display:none !important;

    width:95%;
    max-width:420px;

    padding:30px;

    border-radius:30px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 8px 32px rgba(0,0,0,0.35);

    animation:show 0.4s ease;
}

.screen.active{
    display:block !important;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   العناوين
========================= */

h2,
h3{
    color:white;
    text-align:center;
    margin-bottom:10px;
    font-size:28px;
}

h3{
    font-size:20px;
    margin:0;
}

p{
    color:#ddd;
    text-align:center;
    margin-bottom:18px;
    line-height:1.6;
}

/* =========================
   الإدخالات
========================= */

input{
    width:100%;
    padding:15px;

    border:none;
    outline:none;

    border-radius:18px;

    background:rgba(255,255,255,0.1);

    color:white;

    font-size:16px;

    margin-bottom:15px;

    backdrop-filter:blur(10px);
}

input::placeholder{
    color:#ccc;
}

input[type="file"]{
    cursor:pointer;
}

/* =========================
   الأزرار
========================= */

button{
    width:100%;

    padding:15px;

    border:none;

    border-radius:18px;

    background:
        linear-gradient(
            45deg,
            #00c6ff,
            #0072ff
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    margin-bottom:12px;

    box-shadow:
        0 4px 15px rgba(0,114,255,0.4);
}

button:hover{
    transform:translateY(-2px) scale(1.02);
}

button:active{
    transform:scale(0.98);
}

button.secondary{
    background:
        linear-gradient(
            45deg,
            #ff416c,
            #ff4b2b
        );

    box-shadow:
        0 4px 15px rgba(255,75,43,0.4);
}

/* =========================
   شاشة المحادثة
========================= */

#chatScreen{
    width:100%;
    height:100vh;

    max-width:100%;

    border-radius:0;

    padding:0;

    background:none;
}

#chatScreen.active{
    display:flex !important;
    flex-direction:column;
}

/* =========================
   الهيدر
========================= */

.header{
    min-height:70px;

    background:
        rgba(0,0,0,0.35);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 15px;

    color:white;

    border-bottom:
        1px solid rgba(255,255,255,0.08);

    gap:10px;
}

.header h3{
    flex:1;
    text-align:center;
}

.room-number{
    font-weight:bold;
    color:#00c6ff;
}

/* زر الرجوع */

.back-button{
    width:auto !important;
    min-width:78px;

    padding:10px 14px !important;

    margin:0 !important;

    border-radius:15px !important;

    background:
        rgba(255,255,255,0.15) !important;

    box-shadow:none !important;

    font-size:14px !important;

    white-space:nowrap;
}

.back-button:hover{
    background:
        rgba(255,255,255,0.25) !important;
}

/* =========================
   الرسائل
========================= */

.chat-container{
    flex:1;

    overflow-y:auto;

    padding:20px;

    display:flex;

    flex-direction:column;

    gap:12px;
}

.message{
    max-width:75%;

    padding:14px 16px;

    border-radius:20px;

    animation:fadeIn 0.3s ease;

    position:relative;

    backdrop-filter:blur(10px);

    word-wrap:break-word;

    overflow-wrap:anywhere;
}

.message.sent{
    align-self:flex-end;

    background:
        linear-gradient(
            45deg,
            #00b09b,
            #96c93d
        );

    color:white;

    border-bottom-right-radius:5px;
}

.message.received{
    align-self:flex-start;

    background:
        rgba(255,255,255,0.15);

    color:white;

    border-bottom-left-radius:5px;
}

/* =========================
   اسم المستخدم
========================= */

.username{
    font-size:11px;

    color:#ffe082;

    margin-bottom:5px;

    font-weight:bold;
}

/* =========================
   الكتابة
========================= */

.input-area{
    padding:12px;

    display:flex;

    gap:10px;

    background:
        rgba(0,0,0,0.35);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);
}

.input-area input{
    flex:1;

    margin:0;

    border-radius:30px;

    padding:15px 20px;
}

.input-area button{
    width:auto;

    min-width:90px;

    border-radius:30px;

    padding:0 25px;

    margin:0;
}

/* =========================
   السكرول
========================= */

.chat-container::-webkit-scrollbar{
    width:5px;
}

.chat-container::-webkit-scrollbar-thumb{
    background:
        rgba(255,255,255,0.2);

    border-radius:10px;
}

/* =========================
   الحركة
========================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   الصورة
========================= */

.profile-preview{
    width:70px;
    height:70px;

    border-radius:50%;

    object-fit:cover;

    display:none;

    margin:0 auto 15px;

    border:
        3px solid rgba(255,255,255,0.4);
}

/* =========================
   الجوال
========================= */

@media(max-width:500px){

    .screen{
        padding:25px;
    }

    .message{
        max-width:85%;
    }

    .header{
        padding:0 10px;
        gap:5px;
    }

    .header h3{
        font-size:17px;
    }

    .header > div{
        font-size:12px;
    }

    .back-button{
        min-width:68px !important;
        padding:9px 10px !important;
        font-size:13px !important;
    }

    .input-area{
        padding:8px;
    }

    .input-area button{
        min-width:75px;
        padding:0 15px;
    }

}

</style>

</head>

<body>


<!-- ================================
     شاشة الاسم
================================ -->

<div class="screen active" id="nameScreen">

    <h2>لمسه</h2>

    <p>
        أدخل اسمك المستعار لبدء المحادثة
    </p>

    <img
        id="profilePreview"
        class="profile-preview"
        alt="الصورة الشخصية"
    >

    <input
        type="text"
        id="usernameInput"
        placeholder="اكتب اسمك هنا..."
        maxlength="30"
        autocomplete="off"
    >

    <input
        type="file"
        id="profileImage"
        accept="image/*"
        style="
            margin-bottom:15px;
            color:white;
        "
    >

    <button
        type="button"
        onclick="saveName()"
    >
        استمرار
    </button>

</div>


<!-- ================================
     شاشة الخيارات
================================ -->

<div class="screen" id="optionsScreen">

    <h2>خيارات المحادثة</h2>

    <p>
        اختر الإجراء المطلوب للبدء:
    </p>

    <button
        type="button"
        onclick="showRoomScreen('create')"
    >
        إنشاء محادثة جديدة
    </button>

    <button
        type="button"
        class="secondary"
        onclick="showRoomScreen('join')"
    >
        الانضمام إلى محادثة
    </button>

    <button
        type="button"
        onclick="changeName()"
        style="
            background:rgba(255,255,255,0.15);
            box-shadow:none;
        "
    >
        تغيير الاسم
    </button>

</div>


<!-- ================================
     شاشة الغرفة
================================ -->

<div class="screen" id="roomScreen">

    <h2 id="roomTitle">
        غرفة المحادثة
    </h2>

    <p id="roomDesc">
        أدخل رمزاً مكوناً من 4 أرقام
    </p>

    <input
        type="text"
        id="roomCodeInput"
        placeholder="1234"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
    >

    <p
        id="creatorInfo"
        style="
            color:#27ae60;
            font-weight:bold;
            margin-bottom:15px;
            display:none;
        "
    ></p>

    <button
        type="button"
        id="roomBtn"
        onclick="processRoomAction()"
    >
        تأكيد
    </button>

    <button
        type="button"
        class="secondary"
        onclick="switchScreen('optionsScreen')"
    >
        رجوع
    </button>

</div>


<!-- ================================
     شاشة المحادثة
================================ -->

<div class="screen" id="chatScreen">

    <div class="header">

        <!-- زر الرجوع الجديد -->

        <button
            type="button"
            class="back-button"
            onclick="leaveChat()"
        >
            ← رجوع
        </button>


        <h3>
            لمسه
        </h3>


        <div>
            غرفة:
            <span
                id="activeRoomCode"
                class="room-number"
            >
                0000
            </span>
        </div>

    </div>


    <div
        class="chat-container"
        id="chatContainer"
    ></div>


    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="اكتب رسالتك هنا..."
            maxlength="1000"
            autocomplete="off"
        >

        <button
            type="button"
            onclick="sendMessage()"
        >
            إرسال
        </button>

    </div>

</div>


<!-- ================================
     Firebase
================================ -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set,
    get,
    onChildAdded,
    off
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* ================================
   إعداد Firebase
================================ */

const firebaseConfig = {

    apiKey:
        "AIzaSyDhY1_FeJ53ZUpZlszD9vKkjyMz9HOgYN8",

    authDomain:
        "wats-41f58.firebaseapp.com",

    databaseURL:
        "https://wats-41f58-default-rtdb.firebaseio.com",

    projectId:
        "wats-41f58",

    storageBucket:
        "wats-41f58.firebasestorage.app",

    messagingSenderId:
        "277505138255",

    appId:
        "1:277505138255:web:b7260eb4c7a672141ed43a"

};


/* تشغيل Firebase مرة واحدة فقط */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* ================================
   المتغيرات
================================ */

window.myUsername =
    localStorage.getItem("chatUsername") || "";

window.myProfileImage =
    localStorage.getItem("chatProfile") || "";

window.currentRoomCode =
    "";

window.currentActionType =
    "";

window.currentMessagesRef =
    null;


/* ================================
   تبديل الشاشات
================================ */

window.switchScreen =
function(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    const target =
        document.getElementById(id);


    if(target){

        target.classList.add("active");

    }

};


/* ================================
   تحميل الاسم
================================ */

window.addEventListener(
    "load",
    function(){

        const savedName =
            localStorage.getItem(
                "chatUsername"
            );


        const savedProfile =
            localStorage.getItem(
                "chatProfile"
            );


        if(savedName){

            window.myUsername =
                savedName;


            document.getElementById(
                "usernameInput"
            ).value =
                savedName;


            switchScreen(
                "optionsScreen"
            );

        }


        if(savedProfile){

            const preview =
                document.getElementById(
                    "profilePreview"
                );


            preview.src =
                savedProfile;


            preview.style.display =
                "block";

        }

    }
);


/* ================================
   معاينة الصورة
================================ */

document
    .getElementById("profileImage")
    .addEventListener(
        "change",
        function(){

            const file =
                this.files[0];


            if(!file) return;


            if(!file.type.startsWith("image/")){

                alert(
                    "اختر ملف صورة فقط"
                );

                this.value = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(e){

                    const preview =
                        document.getElementById(
                            "profilePreview"
                        );


                    preview.src =
                        e.target.result;


                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }
    );


/* ================================
   حفظ الاسم
================================ */

window.saveName =
function(){

    const input =
        document.getElementById(
            "usernameInput"
        );


    const name =
        input.value.trim();


    const file =
        document.getElementById(
            "profileImage"
        ).files[0];


    if(name === ""){

        alert(
            "اكتب اسمك أولاً"
        );

        input.focus();

        return;

    }


    if(name.length < 2){

        alert(
            "الاسم يجب أن يكون حرفين على الأقل"
        );

        return;

    }


    localStorage.setItem(
        "chatUsername",
        name
    );


    window.myUsername =
        name;


    if(file){

        const reader =
            new FileReader();


        reader.onload =
            function(e){

                window.myProfileImage =
                    e.target.result;


                localStorage.setItem(
                    "chatProfile",
                    e.target.result
                );


                switchScreen(
                    "optionsScreen"
                );

            };


        reader.readAsDataURL(file);

    }

    else{

        switchScreen(
            "optionsScreen"
        );

    }

};


/* ================================
   تغيير الاسم
================================ */

window.changeName =
function(){

    switchScreen(
        "nameScreen"
    );

};


/* ================================
   اختيار إنشاء / دخول
================================ */

window.showRoomScreen =
function(type){

    window.currentActionType =
        type;


    const title =
        document.getElementById(
            "roomTitle"
        );


    const desc =
        document.getElementById(
            "roomDesc"
        );


    const button =
        document.getElementById(
            "roomBtn"
        );


    const input =
        document.getElementById(
            "roomCodeInput"
        );


    const creatorInfo =
        document.getElementById(
            "creatorInfo"
        );


    input.value = "";

    creatorInfo.style.display =
        "none";


    if(type === "create"){

        title.innerText =
            "إنشاء محادثة جديدة";

        desc.innerText =
            "اختر رمزاً مكوناً من 4 أرقام";

        button.innerText =
            "إنشاء المحادثة";

    }

    else{

        title.innerText =
            "الانضمام إلى محادثة";

        desc.innerText =
            "أدخل رمز المحادثة المكون من 4 أرقام";

        button.innerText =
            "دخول المحادثة";

    }


    switchScreen(
        "roomScreen"
    );


    setTimeout(
        () => input.focus(),
        200
    );

};


/* ================================
   أرقام رمز الغرفة فقط
================================ */

document
    .getElementById("roomCodeInput")
    .addEventListener(
        "input",
        function(){

            this.value =
                this.value
                .replace(/\D/g,"")
                .slice(0,4);

        }
    );


/* ================================
   إنشاء / دخول
================================ */

window.processRoomAction =
async function(){

    const input =
        document.getElementById(
            "roomCodeInput"
        );


    const code =
        input.value.trim();


    if(!/^\d{4}$/.test(code)){

        alert(
            "يجب أن يكون رمز الغرفة 4 أرقام بالضبط"
        );

        input.focus();

        return;

    }


    if(!window.myUsername){

        alert(
            "يجب كتابة الاسم أولاً"
        );

        switchScreen(
            "nameScreen"
        );

        return;

    }


    const button =
        document.getElementById(
            "roomBtn"
        );


    button.disabled =
        true;

    button.innerText =
        "جارٍ المعالجة...";


    try{

        const roomRef =
            ref(
                db,
                "rooms/" + code
            );


        const snapshot =
            await get(roomRef);


        /* إنشاء غرفة */

        if(
            window.currentActionType
            ===
            "create"
        ){

            if(snapshot.exists()){

                alert(
                    "هذه الغرفة موجودة مسبقاً، اختر رمزاً آخر."
                );

                return;

            }


            await set(
                roomRef,
                {

                    creator:
                        window.myUsername,

                    createdAt:
                        Date.now()

                }
            );


            enterChat(code);

        }


        /* دخول غرفة */

        else{

            if(!snapshot.exists()){

                alert(
                    "الغرفة غير موجودة."
                );

                return;

            }


            enterChat(code);

        }

    }

    catch(error){

        console.error(
            "Firebase Error:",
            error
        );


        if(
            error.code ===
            "PERMISSION_DENIED"
        ){

            alert(
                "Firebase رفض الوصول إلى قاعدة البيانات. تأكد من Rules."
            );

        }

        else{

            alert(
                "حدث خطأ أثناء إنشاء البيانات."
            );

        }

    }

    finally{

        button.disabled =
            false;


        button.innerText =
            window.currentActionType === "create"
            ?
            "إنشاء المحادثة"
            :
            "دخول المحادثة";

    }

};


/* ================================
   دخول الشات
================================ */

window.enterChat =
function(code){

    window.currentRoomCode =
        code;


    document.getElementById(
        "activeRoomCode"
    ).innerText =
        code;


    const container =
        document.getElementById(
            "chatContainer"
        );


    container.innerHTML =
        "";


    /* إزالة المستمع السابق */

    if(window.currentMessagesRef){

        off(
            window.currentMessagesRef
        );

        window.currentMessagesRef =
            null;

    }


    const messagesRef =
        ref(
            db,
            "rooms/" +
            code +
            "/messages"
        );


    window.currentMessagesRef =
        messagesRef;


    onChildAdded(
        messagesRef,
        function(snapshot){

            const msg =
                snapshot.val();


            if(!msg) return;


            appendMessageToDOM(
                msg.sender ||
                "مستخدم",

                msg.text ||
                ""
            );

        }
    );


    switchScreen(
        "chatScreen"
    );


    setTimeout(
        function(){

            document
                .getElementById(
                    "messageInput"
                )
                .focus();

        },
        200
    );

};


/* ================================
   زر الرجوع
================================ */

window.leaveChat =
function(){

    /* إيقاف استقبال الرسائل */

    if(window.currentMessagesRef){

        off(
            window.currentMessagesRef
        );

        window.currentMessagesRef =
            null;

    }


    /* تنظيف الشاشة */

    document.getElementById(
        "chatContainer"
    ).innerHTML =
        "";


    document.getElementById(
        "messageInput"
    ).value =
        "";


    /* تصفير الغرفة الحالية */

    window.currentRoomCode =
        "";


    document.getElementById(
        "activeRoomCode"
    ).innerText =
        "0000";


    /* الرجوع للخيارات */

    switchScreen(
        "optionsScreen"
    );

};


/* ================================
   إضافة رسالة
================================ */

window.appendMessageToDOM =
function(sender,text){

    const container =
        document.getElementById(
            "chatContainer"
        );


    const div =
        document.createElement(
            "div"
        );


    if(
        sender ===
        window.myUsername
    ){

        div.className =
            "message sent";

    }

    else{

        div.className =
            "message received";

    }


    const username =
        document.createElement(
            "div"
        );


    username.className =
        "username";


    username.textContent =
        sender;


    const messageText =
        document.createElement(
            "div"
        );


    messageText.textContent =
        text;


    div.appendChild(
        username
    );


    div.appendChild(
        messageText
    );


    container.appendChild(
        div
    );


    container.scrollTop =
        container.scrollHeight;

};


/* ================================
   إرسال رسالة
================================ */

window.sendMessage =
async function(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(text === ""){

        return;

    }


    if(!window.currentRoomCode){

        alert(
            "لم تدخل إلى غرفة بعد."
        );

        return;

    }


    if(!window.myUsername){

        alert(
            "الاسم غير موجود."
        );

        return;

    }


    input.disabled =
        true;


    try{

        await push(
            ref(
                db,
                "rooms/" +
                window.currentRoomCode +
                "/messages"
            ),
            {

                sender:
                    window.myUsername,

                text:
                    text,

                timestamp:
                    Date.now()

            }
        );


        input.value =
            "";

    }

    catch(error){

        console.error(
            error
        );


        alert(
            "تعذر إرسال الرسالة."
        );

    }

    finally{

        input.disabled =
            false;

        input.focus();

    }

};


/* ================================
   Enter للإرسال
================================ */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                sendMessage();

            }

        }
    );

</script>
